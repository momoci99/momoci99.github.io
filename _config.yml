# The Site Configuration
# Theme docs: https://github.com/cotes2020/jekyll-theme-chirpy

theme: jekyll-theme-chirpy

lang: ko-KR
timezone: Asia/Seoul

# jekyll-seo-tag settings
title: YKMO 기술 메모
tagline: 성장하는 즐거움
description: >-
  ykmo 기술 메모장

# No trailing slash
url: "https://momoci99.github.io"

github:
  username: momoci99

twitter:
  username:

social:
  name: MO YEONG-KWON
  email: momoci99@gmail.com
  links:
    - https://github.com/momoci99

webmaster_verifications:
  google:
  bing:
  yandex:

# Web Analytics Settings
# The old Universal Analytics ID (UA-154155002-1) stopped collecting data in 2023.
# Put a GA4 measurement ID (G-XXXXXXXXXX) here to enable analytics again.
analytics:
  google:
    id:

pageviews:
  provider:

# Empty = follow the system color scheme, with a light/dark toggle in the sidebar
theme_mode:

cdn:

avatar: /assets/img/avatar.jpg

social_preview_image: /assets/img/og-image.jpg

toc: true

actions:
  edit_post:
    enabled: false
    url: ""
    static_url: false

comments:
  provider: disqus # [disqus | utterances | giscus]
  disqus:
    shortname: momoci99
  utterances:
    repo:
    issue_term:
  giscus:
    repo:
    repo_id:
    category:
    category_id:
    mapping:
    strict:
    input_position:
    lang:
    reactions_enabled:

assets:
  self_host:
    enabled:
    env:

pwa:
  enabled: true
  cache:
    enabled: true
    deny_paths:

paginate: 10

baseurl: ""

# ------------ The following options are not recommended to be modified ------------------

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      toc: true
      # Keep the URL format of the old theme (/:title/) so existing links and search results keep working.
      permalink: /:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - purgecss.js
  - "*.config.js"
  - "package*.json"

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
